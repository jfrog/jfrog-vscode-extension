[project]
name = "Example_Project"
version = "0.1.0"
authors = [{ name = "Some One", email = "someone@myserver.com" }]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "pyyaml",
    "fire==0.1.3",  # pinned on purpose
    "matplotlib>=2.2.0,<2.4.0",
    "newrelic==2.0.*",
    "jupyter~=1.1.1",
    "numpy>=1.14.5",
    "huggingface_hub",
    "requests[socks]==2.32.4",
    "uvicorn[standard]==0.30.0",
    "django-extensions==3.2.3",
    "tomli==2.0.1 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest==8.0.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
